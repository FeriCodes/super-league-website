<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Super League H2H{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">

    <!-- JetBrains Mono Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Dark Theme CSS (Cache-Busted) -->
    <link rel="stylesheet" href="/static/css/style.css?v=1.1">
  </head>
  <body class="py-3 py-md-4">
    <div class="container px-2 px-md-3">

      <!-- App Horizontal Pill Navbar -->
      <nav class="app-navbar mb-4">
        <a href="/" class="nav-pill-btn {% if active_page == 'compare' %}active{% endif %}">
          ⚔️ Compare
        </a>
        <a href="/fixtures" class="nav-pill-btn {% if active_page == 'fixtures' %}active{% endif %}">
          📅 Fixtures
        </a>
        <a href="/standings" class="nav-pill-btn {% if active_page == 'standings' %}active{% endif %}">
          🏆 Standings
        </a>
      </nav>

      <!-- Child Pages Content Block -->
      {% block content %}{% endblock %}

    </div>

    <!-- Scripts Block -->
    {% block scripts %}{% endblock %}
  </body>
</html>
